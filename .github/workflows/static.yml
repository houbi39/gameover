# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run exploit-chain regression tests
        run: node --test tests/test_exploit_chain_regressions.mjs
      - name: Regenerate and validate AppCache manifests
        run: |
          python scripts/update_appcache_manifests.py
          python scripts/update_appcache_manifests.py --check
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Wait for Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --fail \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${artifact_url}")" || {
                echo "Artifact API not ready (attempt ${attempt}/12)."
                sleep 5
                continue
              }
            if jq -e '.artifacts | any(.[]; .name == "github-pages" and .expired == false)' <<< "${response}" >/dev/null; then
              echo "The github-pages artifact is visible and ready."
              exit 0
            fi
            echo "Waiting for github-pages artifact indexing (attempt ${attempt}/12)."
            sleep 5
          done
          echo "The github-pages artifact did not become visible within 60 seconds." >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
