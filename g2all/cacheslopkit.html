<script>
var cache=window.applicationCache;
var returnStarted=false;
function SetMessage(message){var target=document.getElementById("msgs");if(target)target.innerHTML=message;}
function DLProgress(e){var percent=Math.round(e.loaded/e.total*100);SetMessage("جارٍ تثبيت التخزين المؤقت: "+percent+"%");}
function ReturnToHost(){if(returnStarted)return;returnStarted=true;SetMessage("اكتمل التخزين المؤقت. جارٍ فتح المضيف...");window.location.replace("index.html");}
function ActivateCacheUpdate(){try{cache.swapCache();}catch(e){SetMessage("تم تنزيل التخزين المؤقت لكن تعذّر تفعيله. تحقق من الاتصال ثم حاول مجدداً.");return;}ReturnToHost();}
function CacheError(){SetMessage("تعذّر تحديث التخزين المؤقت. ما زالت النسخة السابقة تعمل. تحقق من الاتصال ثم حاول مجدداً.");}
cache.addEventListener("progress",DLProgress,false);
cache.addEventListener("cached",ReturnToHost,false);
cache.addEventListener("noupdate",ReturnToHost,false);
cache.addEventListener("updateready",ActivateCacheUpdate,false);
cache.addEventListener("error",CacheError,false);
if(cache.status==cache.UPDATEREADY)ActivateCacheUpdate();
</script>
